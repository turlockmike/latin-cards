<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabula Latina</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#7C2153">
<style>
  /* ---- tokens: light = marble, dark = wax tablet ---- */
  :root{
    --ground:#F3F3F0; --surface:#FBFAF8; --ink:#26222B; --ink-soft:#5C5561;
    --line:#DCD8D2; --accent:#7C2153; --accent-ink:#FFFFFF;
    --bronze:#8A6A3B; --good:#4A7A4E; --okay:#A65A2E; --bad:#9E3A3A;
    --chip:#EBE9E4; --shadow:0 2px 12px rgba(38,34,43,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#1C1720; --surface:#262029; --ink:#EDE7E0; --ink-soft:#A79DA8;
      --line:#3A3340; --accent:#C4638F; --accent-ink:#1C1720;
      --bronze:#B08D57; --good:#7FAE82; --okay:#C98756; --bad:#C97A7A;
      --chip:#302935; --shadow:0 2px 12px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#1C1720; --surface:#262029; --ink:#EDE7E0; --ink-soft:#A79DA8;
    --line:#3A3340; --accent:#C4638F; --accent-ink:#1C1720;
    --bronze:#B08D57; --good:#7FAE82; --okay:#C98756; --bad:#C97A7A;
    --chip:#302935; --shadow:0 2px 12px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; line-height:1.45;
  }
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
  #app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
  .eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);font-weight:600}
  h1.brand{font-size:2rem;margin:.1em 0 .05em;font-weight:600;letter-spacing:.02em;text-wrap:balance}
  h1.brand .macron{color:var(--accent)}
  .sub{color:var(--ink-soft);margin:0 0 20px;font-size:.95rem}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .stack{display:flex;flex-direction:column;gap:12px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);border-radius:10px;padding:8px 14px}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .chip{border-radius:999px;padding:6px 14px;background:var(--chip);border:1px solid transparent}
  .chip.active{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--surface)}
  /* deck cards */
  .deck{width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface);
    box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .deck b{font-size:1.05rem}
  .deck small{color:var(--ink-soft);display:block;margin-top:2px}
  .due-pill{font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-ink);
    border-radius:999px;padding:3px 11px;font-size:.85rem;font-weight:700;white-space:nowrap}
  .due-pill.zero{background:var(--chip);color:var(--ink-soft);font-weight:500}
  /* study card = the tabula */
  .tabula{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);
    border-radius:16px;box-shadow:var(--shadow);padding:34px 22px;min-height:280px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;cursor:pointer}
  .tabula .word{font-size:2.1rem;line-height:1.2;text-wrap:balance}
  .tabula .latin{font-size:2.3rem;color:var(--accent)}
  .tabula .gram{color:var(--bronze);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}
  .tabula .note{color:var(--ink-soft);font-size:.95rem;max-width:42ch}
  .neo-badge{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--bronze);
    color:var(--bronze);border-radius:999px;padding:2px 9px}
  .hint{color:var(--ink-soft);font-size:.85rem}
  .grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
  .grades button{padding:14px 8px;font-weight:700;border-radius:12px;font-size:1rem}
  .grades .bad{color:var(--bad);border-color:var(--bad)}
  .grades .okay{color:var(--okay);border-color:var(--okay)}
  .grades .good{background:var(--good);border-color:var(--good);color:#fff}
  .grades small{display:block;font-weight:400;font-size:.72rem;opacity:.75;margin-top:2px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
  .progress{height:4px;background:var(--chip);border-radius:2px;overflow:hidden;flex:1}
  .progress i{display:block;height:100%;background:var(--bronze);transition:width .25s}
  .browse-item{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
  .browse-item .la{color:var(--accent);font-size:1.05rem}
  .browse-item .meta{color:var(--ink-soft);font-size:.8rem;text-align:right;white-space:nowrap}
  input[type=text]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;width:100%}
  input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .speak{border-radius:999px;padding:6px 12px}
  .stat{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<script src="fsrs.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  /* PWA offline (same pattern as kana-cards); no-op where SW is unavailable (e.g. artifact sandbox) */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
</script>
</body>
</html>
